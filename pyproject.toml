# Объявление сборки - секция для настройки системы сборки Python-пакетов
[build-system]
requires = ["setuptools>=45", "wheel"]  # Список зависимостей, необходимых для сборки пакета (setuptools и wheel)
build-backend = "setuptools.build_meta"  # Указание бэкенда для сборки (используется setuptools)

# Настройки для Black - инструмента автоматического форматирования Python-кода
[tool.black]
line-length = 88  # Максимальная допустимая длина строки перед переносом
target-version = ['py38']  # Целевые версии Python для совместимости (Python 3.8 и выше)
include = '\.pyi?$'  # Регулярное выражение для файлов, которые нужно форматировать (.py и .pyi)
extend-exclude = '''
/(
  # directories - список директорий, которые Black должен игнорировать
  \.eggs      # Директория с Python egg-пакетами
  | \.git     # Git-репозиторий
  | \.hg      # Mercurial-репозиторий
  | \.mypy_cache  # Кэш-директория статического анализатора mypy
  | \.tox     # Директория для тестирования с tox
  | \.venv    # Виртуальное окружение Python
  | build     # Директория сборки пакета
  | dist      # Директория с собранными дистрибутивами
)/
'''

# Настройки для pytest - фреймворка для тестирования Python-кода
[tool.pytest.ini_options]
testpaths = ["tests"]  # Директории, в которых pytest будет искать тесты
python_files = ["test_*.py"]  # Паттерн имен файлов с тестами (начинаются с test_)
python_classes = ["Test*"]    # Паттерн имен классов тестов (начинаются с Test)
python_functions = ["test_*"] # Паттерн имен функций тестов (начинаются с test_)
addopts = [  # Дополнительные опции командной строки, применяемые при каждом запуске pytest
    "--strict-markers",  # Включение строгой проверки маркеров (ошибка при неизвестных маркерах)
    "--strict-config",   # Включение строгой проверки конфигурации
    "--verbose"          # Включение подробного вывода информации о выполнении тестов
]
markers = [  # Определение пользовательских маркеров для категоризации тестов
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",  # Маркер для медленных тестов (можно исключить флагом -m "not slow")
    "integration: marks tests as integration tests"  # Маркер для интеграционных тестов
]

# Настройки для coverage - инструмента измерения покрытия кода тестами
[tool.coverage.run]
source = ["src"]  # Директории с исходным кодом, для которых измеряется покрытие
omit = [  # Шаблоны путей, которые следует исключить из измерения покрытия
    "*/test_*",       # Все тестовые файлы (они не должны влиять на покрытие)
    "*/__pycache__/*" # Кэш-директории интерпретатора Python
]

[tool.coverage.report]
exclude_lines = [  # Строки кода, которые следует исключить из отчета о покрытии
    "pragma: no cover",        # Строки с директивами pragma для явного исключения из покрытия
    "def __repr__",            # Автоматически генерируемые методы __repr__
    "if self.debug:",          # Условные ветвления для отладочного режима
    "if settings.DEBUG",       # Проверки настроек отладки
    "raise AssertionError",    # Строки с выбросом AssertionError (обычно для проверок)
    "raise NotImplementedError", # Строки с выбросом NotImplementedError (еще не реализовано)
    "if 0:",                   # Недостижимый код (всегда ложное условие)
    "if __name__ == .__main__.:", # Блоки выполнения при запуске как основного скрипта
    "class .*\\bProtocol\\):",    # Классы, реализующие Protocol (часто абстрактные)
    "@(abc\\.)?abstractmethod"    # Декораторы для абстрактных методов
]